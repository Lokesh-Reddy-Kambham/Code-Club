<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="Heading">Welcome to Dom Manipulations</h1>
    <p id="para">Iam Learning DOM</p>
    <button id="Btn" onclick="NewButton()">Change Text</button>
    <script>
        function NewButton(){
          let NewHeading=document.getElementById("Heading");
          let NewPara=document.getElementById("para");
          let Butn=document.getElementById("Btn");
          NewHeading.textContent="Dom is working!";
          NewPara.textContent="I am Learning Dom successfully!"
          NewPara.style.color="green";
          NewPara.style.textAlign="center";
          Butn.style.color="red";
        }
    </script>
</body>
</html>
