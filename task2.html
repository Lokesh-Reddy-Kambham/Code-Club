<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="center">
    <h1 id="count">0</h1>
    <button onclick="Increase()">Increase</button>
    <button onclick="Decrease()">Decrease</button>
</div>
<script>
    let Number=0;
    function Increase(){
        Number=Number+1
        let Newcount=document.getElementById("count");
        Newcount.textContent=Number
        Newcount.style.color="red";
        
    }
    function Decrease(){
        Number=Number-1
        let Newcount=document.getElementById("count");
        Newcount.textContent=Number
        Newcount.style.color="blue";
    }
</script>
</body>
</html>
